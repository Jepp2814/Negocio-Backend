{% extends 'dashboard/base.html' %}


{% block content %}


<h1 class="title">Productos:</h1>


<div class="cards productos-cards">


    <div
        class="card producto-card"
        onclick="window.location.href='{% url 'ingresar_producto' %}'"
    >
        <i class="fa-solid fa-circle-plus"></i>
        <h2>Ingresar Producto:</h2>
    </div>


    <div
        class="card producto-card"
        onclick="window.location.href='{% url 'editar_producto' %}'"
    >
        <i class="fa-solid fa-pen-to-square"></i>
        <h2>Editar Producto:</h2>
    </div>


    <div
        class="card producto-card"
        onclick="window.location.href='{% url 'eliminar_productos' %}'"
    >
        <i class="fa-solid fa-trash-can"></i>
        <h2>Eliminar Producto:</h2>
    </div>


    <div
        class="card producto-card"
        onclick="window.location.href='{% url 'consultar_productos' %}'"
    >
        <i class="fa-solid fa-magnifying-glass"></i>
        <h2>Consultar Producto:</h2>
    </div>


</div>


{% endblock %}
