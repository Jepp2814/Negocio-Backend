<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Usuario creado</title>
    <style>
        * { box-sizing: border-box; }

        body {
            margin: 0;
            min-height: 100vh;
            font-family: Arial, sans-serif;
            background: linear-gradient(135deg, #ecfdf5, #d1fae5);
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        .card {
            width: 100%;
            max-width: 450px;
            background: white;
            border-radius: 20px;
            box-shadow: 0 18px 40px rgba(0, 0, 0, 0.10);
            padding: 32px;
            text-align: center;
        }

        .check {
            width: 90px;
            height: 90px;
            border-radius: 50%;
            background: #22c55e;
            color: white;
            display: flex;
            justify-content: center;
            align-items: center;
            font-size: 42px;
            margin: 0 auto 20px;
        }

        h1 {
            color: #166534;
            margin-bottom: 10px;
        }

        p {
            color: #374151;
            margin-bottom: 24px;
        }

        .btn {
            display: inline-block;
            padding: 14px 22px;
            border-radius: 10px;
            background: #2563eb;
            color: white;
            text-decoration: none;
            font-weight: bold;
        }
    </style>
</head>
<body>
    <div class="card">
        <div class="check">✓</div>
        <h1>Usuario creado correctamente</h1>
        <p>Su información fue registrada con éxito. Ahora puede iniciar sesión.</p>
        <a href="{% url 'login' %}" class="btn">Aceptar y volver al login</a>
    </div>
</body>
</html>
