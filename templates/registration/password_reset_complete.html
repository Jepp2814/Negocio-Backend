{% load static %}
<!DOCTYPE html>
<html lang="es">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Contraseña actualizada | AppMecaniza</title>

<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">

<link rel="stylesheet"
href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.6.0/css/all.min.css">

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:'Poppins',sans-serif;
}

body{

display:flex;
justify-content:center;
align-items:center;

height:100vh;

background:linear-gradient(135deg,#0f172a,#1e3a8a,#2563eb);

overflow:hidden;

}

.card{

width:460px;

background:white;

border-radius:25px;

padding:45px;

text-align:center;

box-shadow:0 20px 45px rgba(0,0,0,.25);

animation:entrada .8s;

}

@keyframes entrada{

from{

opacity:0;
transform:translateY(40px);

}

to{

opacity:1;
transform:translateY(0);

}

}

.logo{

width:120px;

margin-bottom:15px;

}

.success{

width:120px;
height:120px;

margin:auto;

border-radius:50%;

background:#dcfce7;

display:flex;

justify-content:center;

align-items:center;

animation:latido 2s infinite;

}

.success i{

font-size:60px;

color:#16a34a;

}

@keyframes latido{

0%{transform:scale(1);}
50%{transform:scale(1.08);}
100%{transform:scale(1);}

}

h1{

margin-top:25px;

color:#1e3a8a;

}

p{

margin-top:20px;

line-height:28px;

font-size:16px;

color:#64748b;

}

.btn{

display:inline-block;

margin-top:35px;

padding:15px 35px;

background:#2563eb;

color:white;

text-decoration:none;

border-radius:12px;

font-weight:bold;

transition:.3s;

}

.btn:hover{

background:#1d4ed8;

transform:translateY(-3px);

}

footer{

margin-top:30px;

font-size:13px;

color:#94a3b8;

}

</style>

</head>

<body>

<div class="card">

<img src="{% static 'img/logo.png' %}" class="logo">

<div class="success">

<i class="fa-solid fa-circle-check"></i>

</div>

<h1>

¡Contraseña actualizada!

</h1>

<p>

Tu contraseña fue cambiada correctamente.

Ahora ya puedes iniciar sesión nuevamente en AppMecaniza utilizando tu nueva contraseña.

</p>

<a href="{% url 'login' %}" class="btn">

<i class="fa-solid fa-right-to-bracket"></i>

Iniciar sesión

</a>

<footer>

© 2026 AppMecaniza · Sistema Inteligente para Talleres Mecánicos

</footer>

</div>

</body>

</html>
