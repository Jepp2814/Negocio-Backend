{% load static %}
<!DOCTYPE html>
<html lang="es">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Correo enviado | AppMecánica Emilio</title>

<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">

<link rel="stylesheet"
href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.6.0/css/all.min.css">

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:Poppins,sans-serif;
}

body{

height:100vh;

display:flex;
justify-content:center;
align-items:center;

background:linear-gradient(135deg,#0f172a,#1e3a8a,#2563eb);

}

.card{

width:460px;

background:white;

padding:45px;

border-radius:22px;

text-align:center;

box-shadow:0 20px 45px rgba(0,0,0,.25);

animation:entrada .8s;

}

@keyframes entrada{

from{

opacity:0;
transform:translateY(35px);

}

to{

opacity:1;
transform:translateY(0);

}

}

.logo{

width:120px;

margin-bottom:15px;

}

.circle{

width:110px;
height:110px;

margin:20px auto;

border-radius:50%;

background:#dbeafe;

display:flex;

justify-content:center;

align-items:center;

}

.circle i{

font-size:55px;

color:#2563eb;

animation:latido 1.5s infinite;

}

@keyframes latido{

0%{transform:scale(1);}
50%{transform:scale(1.15);}
100%{transform:scale(1);}

}

h1{

color:#1e40af;

margin-bottom:15px;

}

p{

color:#64748b;

line-height:28px;

font-size:16px;

margin-bottom:30px;

}

a{

display:inline-block;

padding:14px 30px;

border-radius:12px;

background:#2563eb;

color:white;

text-decoration:none;

font-weight:600;

transition:.3s;

}

a:hover{

background:#1d4ed8;

transform:translateY(-2px);

}

</style>

</head>

<body>

<div class="card">

<img src="{% static 'img/logo.png' %}" class="logo">

<div class="circle">

<i class="fa-solid fa-envelope-open-text"></i>

</div>

<h1>¡Correo enviado!</h1>

<p>

Si existe una cuenta asociada al correo ingresado,
hemos enviado un enlace para restablecer la contraseña.

Revise también la carpeta de spam o correo no deseado.

</p>

<a href="{% url 'login' %}">

<i class="fa-solid fa-arrow-left"></i>

Volver al inicio

</a>

</div>

</body>

</html>
