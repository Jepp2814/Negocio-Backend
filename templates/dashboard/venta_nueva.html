{% extends 'dashboard/base.html' %}

{% block content %}

<div class="venta-nueva-container">

    <h1 class="title">Venta Nueva</h1>

    <div class="tabla-venta-contenedor">

        <table class="tabla-venta">

            <thead>
                <tr>
                    <th class="columna-seleccion">Seleccionar</th>
                    <th>Código</th>
                    <th>Descripción</th>
                    <th>Cantidad</th>
                    <th>Valor unitario</th>
                    <th>Valor por caja</th>
                    <th>Total</th>
                </tr>
            </thead>

            <tbody id="detalle-venta">

                <tr class="fila-buscar-producto">
                    <td colspan="3" class="celda-buscador">
                        <div class="buscador-producto-contenedor">
                            <input
                                type="text"
                                id="buscar-producto"
                                placeholder="Escriba nombre o código del producto"
                                autocomplete="off"
                            >

                            <div
                                id="sugerencias-productos"
                                class="sugerencias-productos"
                            ></div>
                        </div>
                    </td>

                    <td colspan="4">
                        <button
                            type="button"
                            id="btn-agregar-producto"
                            class="btn-agregar-producto"
                        >
                            <i class="fa-solid fa-plus"></i>
                            Agregar producto
                        </button>
                    </td>
                </tr>

                <tr id="fila-vacia">
                    <td colspan="7" class="sin-productos">
                        No hay productos agregados.
                    </td>
                </tr>

            </tbody>

        </table>

    </div>

    <div id="mensaje-producto" class="mensaje-producto"></div>

    <div class="venta-acciones">

        <button
            type="button"
            id="btn-eliminar-seleccionados"
            class="btn-eliminar-seleccionado"
        >
            <i class="fa-solid fa-trash"></i>
            Eliminar productos seleccionados
        </button>

        <div class="total-venta">
            <span>Total de venta:</span>
            <strong id="total-venta">$0.00</strong>
        </div>

    </div>

</div>

<style>
    .venta-nueva-container {
        padding: 40px;
    }

    .tabla-venta-contenedor {
        overflow-x: auto;
        background: white;
        border-radius: 12px;
        box-shadow: 0 5px 15px rgba(0, 0, 0, .08);
    }

    .tabla-venta {
        width: 100%;
        border-collapse: collapse;
    }

    .tabla-venta th {
        background: #0F4C81;
        color: white;
        text-align: left;
    }

    .tabla-venta th,
    .tabla-venta td {
        padding: 14px;
        border-bottom: 1px solid #e5e7eb;
    }

    .columna-seleccion {
        width: 105px;
        text-align: center;
    }

    .fila-buscar-producto td {
        background: #f8fafc;
    }

    .celda-buscador {
        position: relative;
    }

    .buscador-producto-contenedor {
        position: relative;
        width: 100%;
    }

    .fila-buscar-producto input {
        width: 100%;
        padding: 10px;
        border: 1px solid #d1d5db;
        border-radius: 7px;
        font-size: 14px;
    }

    .sugerencias-productos {
        display: none;
        position: absolute;
        top: calc(100% + 5px);
        left: 0;
        z-index: 20;
        width: 100%;
        max-height: 230px;
        overflow-y: auto;
        background: white;
        border: 1px solid #d1d5db;
        border-radius: 7px;
        box-shadow: 0 8px 18px rgba(0, 0, 0, .12);
    }

    .sugerencias-productos.mostrar {
        display: block;
    }

    .sugerencia-producto {
        width: 100%;
        padding: 11px 12px;
        border: none;
        border-bottom: 1px solid #e5e7eb;
        background: white;
        color: #1f2937;
        text-align: left;
        cursor: pointer;
    }

    .sugerencia-producto:last-child {
        border-bottom: none;
    }

    .sugerencia-producto:hover {
        background: #dbeafe;
    }

    .sugerencia-codigo {
        display: block;
        margin-bottom: 3px;
        color: #0F4C81;
        font-size: 13px;
        font-weight: bold;
    }

    .sugerencia-nombre {
        font-size: 14px;
    }

    .tabla-venta .cantidad-producto {
        width: 75px;
        padding: 8px;
        border: 1px solid #d1d5db;
        border-radius: 6px;
    }

    .checkbox-producto {
        width: 18px;
        height: 18px;
        cursor: pointer;
    }

    .btn-agregar-producto {
        border: none;
        border-radius: 8px;
        padding: 10px 15px;
        background: #0F4C81;
        color: white;
        font-size: 14px;
        cursor: pointer;
    }

    .btn-agregar-producto:hover {
        background: #0B3158;
    }

    .fila-producto:hover {
        background: #f1f5f9;
    }

    .fila-producto.seleccionada {
        background: #dbeafe;
    }

    .sin-productos {
        text-align: center;
        color: #6b7280;
    }

    .mensaje-producto {
        min-height: 22px;
        margin-top: 15px;
        color: #dc2626;
    }

    .venta-acciones {
        display: flex;
        align-items: center;
        justify-content: space-between;
        margin-top: 25px;
    }

    .btn-eliminar-seleccionado {
        border: none;
        border-radius: 8px;
        padding: 11px 15px;
        background: #dc2626;
        color: white;
        font-size: 14px;
        cursor: pointer;
    }

    .btn-eliminar-seleccionado:hover {
        background: #b91c1c;
    }

    .total-venta {
        display: flex;
        gap: 12px;
        font-size: 20px;
    }

    .total-venta strong {
        color: #0F4C81;
    }
</style>

<script>
    const inputBuscarProducto = document.getElementById("buscar-producto");
    const botonAgregarProducto = document.getElementById("btn-agregar-producto");
    const botonEliminarSeleccionados = document.getElementById(
        "btn-eliminar-seleccionados"
    );
    const detalleVenta = document.getElementById("detalle-venta");
    const mensajeProducto = document.getElementById("mensaje-producto");
    const totalVenta = document.getElementById("total-venta");
    const sugerenciasProductos = document.getElementById(
        "sugerencias-productos"
    );

    let productoSeleccionadoParaAgregar = null;
    let tiempoBusqueda = null;


    function formatoMoneda(valor) {
        return `$${Number(valor || 0).toFixed(2)}`;
    }

    function calcularTotalVenta() {
        let total = 0;

        document.querySelectorAll(".fila-producto").forEach((fila) => {
            total += Number(fila.dataset.total || 0);
        });

        totalVenta.textContent = formatoMoneda(total);
    }

    function actualizarFila(fila) {
        const cantidadInput = fila.querySelector(".cantidad-producto");
        const precioUnitario = Number(fila.dataset.precioUnitario || 0);
        const cantidad = Math.max(Number(cantidadInput.value) || 1, 1);

        cantidadInput.value = cantidad;

        const valorCaja = precioUnitario * cantidad;

        fila.querySelector(".valor-caja").textContent = formatoMoneda(valorCaja);
        fila.querySelector(".total-producto").textContent = formatoMoneda(valorCaja);

        fila.dataset.total = valorCaja;

        calcularTotalVenta();
    }

    function actualizarSeleccionFila(fila) {
        const checkbox = fila.querySelector(".checkbox-producto");

        if (checkbox.checked) {
            fila.classList.add("seleccionada");
        } else {
            fila.classList.remove("seleccionada");
        }
    }

    function mostrarFilaVaciaSiEsNecesario() {
        const productos = document.querySelectorAll(".fila-producto");

        if (productos.length === 0 && !document.getElementById("fila-vacia")) {
            detalleVenta.insertAdjacentHTML(
                "beforeend",
                `
                    <tr id="fila-vacia">
                        <td colspan="7" class="sin-productos">
                            No hay productos agregados.
                        </td>
                    </tr>
                `
            );
        }
    }

    function cerrarSugerencias() {
        sugerenciasProductos.innerHTML = "";
        sugerenciasProductos.classList.remove("mostrar");
    }

    function mostrarSugerencias(productos) {
        sugerenciasProductos.innerHTML = "";

        if (!productos || productos.length === 0) {
            cerrarSugerencias();
            return;
        }

        productos.forEach((producto) => {
            const boton = document.createElement("button");

            boton.type = "button";
            boton.className = "sugerencia-producto";

            const codigo = producto.codigo || producto.id;
            const nombre = producto.nombre || "Producto sin nombre";
            const marca = producto.marca ? ` - ${producto.marca}` : "";

            boton.innerHTML = `
                <span class="sugerencia-codigo">${codigo}</span>
                <span class="sugerencia-nombre">${nombre}${marca}</span>
            `;

            boton.addEventListener("click", () => {
                productoSeleccionadoParaAgregar = producto;
                inputBuscarProducto.value = `${codigo} - ${nombre}`;
                cerrarSugerencias();
                agregarProductoATabla(producto);
                inputBuscarProducto.value = "";
                inputBuscarProducto.focus();
            });

            sugerenciasProductos.appendChild(boton);
        });

        sugerenciasProductos.classList.add("mostrar");
    }

    async function buscarSugerencias() {
        const termino = inputBuscarProducto.value.trim();

        productoSeleccionadoParaAgregar = null;

        if (!termino) {
            cerrarSugerencias();
            return;
        }

        try {
            const respuesta = await fetch(
                `/api/productos/?search=${encodeURIComponent(termino)}`
            );

            if (!respuesta.ok) {
                throw new Error("Error en la búsqueda");
            }

            const datos = await respuesta.json();
            const productos = datos.results || datos;

            mostrarSugerencias(productos);
        } catch (error) {
            cerrarSugerencias();
        }
    }

    function agregarProductoATabla(producto) {
        const filaVacia = document.getElementById("fila-vacia");

        if (filaVacia) {
            filaVacia.remove();
        }

        const precioUnitario = Number(producto.precio_venta || 0);
        const precioCaja = Number(
            producto.precio_venta_caja || producto.precio_venta || 0
        );
        const codigo = producto.codigo || producto.id;
        const descripcion = producto.nombre || "Producto sin descripción";

        const fila = document.createElement("tr");

        fila.classList.add("fila-producto");
        fila.dataset.precioUnitario = precioUnitario;
        fila.dataset.precioCaja = precioCaja;
        fila.dataset.total = precioUnitario;

        fila.innerHTML = `
            <td class="columna-seleccion">
                <input
                    type="checkbox"
                    class="checkbox-producto"
                    aria-label="Seleccionar ${descripcion}"
                >
            </td>
            <td>${codigo}</td>
            <td>${descripcion}</td>
            <td>
                <input
                    type="number"
                    class="cantidad-producto"
                    value="1"
                    min="1"
                >
            </td>
            <td>${formatoMoneda(precioUnitario)}</td>
            <td class="valor-caja">${formatoMoneda(precioCaja)}</td>
            <td class="total-producto">${formatoMoneda(precioUnitario)}</td>
        `;

        const inputCantidad = fila.querySelector(".cantidad-producto");
        const checkbox = fila.querySelector(".checkbox-producto");

        checkbox.addEventListener("change", () => {
            actualizarSeleccionFila(fila);
        });

        fila.addEventListener("click", (evento) => {
            if (
                evento.target.classList.contains("cantidad-producto") ||
                evento.target.classList.contains("checkbox-producto")
            ) {
                return;
            }

            checkbox.checked = !checkbox.checked;
            actualizarSeleccionFila(fila);
        });

        inputCantidad.addEventListener("input", () => {
            actualizarFila(fila);
        });

        detalleVenta.appendChild(fila);
        calcularTotalVenta();
    }

    async function buscarYAgregarProducto() {
        mensajeProducto.textContent = "";

        const termino = inputBuscarProducto.value.trim();

        if (productoSeleccionadoParaAgregar) {
            agregarProductoATabla(productoSeleccionadoParaAgregar);
            inputBuscarProducto.value = "";
            cerrarSugerencias();
            return;
        }

        if (!termino) {
            mensajeProducto.textContent =
                "Escriba un nombre o código para buscar el producto.";
            return;
        }

        try {
            const respuesta = await fetch(
                `/api/productos/?search=${encodeURIComponent(termino)}`
            );

            if (!respuesta.ok) {
                throw new Error("Error en la búsqueda");
            }

            const datos = await respuesta.json();
            const productos = datos.results || datos;

            if (!productos || productos.length === 0) {
                mensajeProducto.textContent =
                    "No se encontró ningún producto.";
                return;
            }

            if (productos.length === 1) {
                agregarProductoATabla(productos[0]);
                inputBuscarProducto.value = "";
                cerrarSugerencias();
                inputBuscarProducto.focus();
                return;
            }

            mensajeProducto.textContent =
                "Seleccione uno de los productos sugeridos.";
            mostrarSugerencias(productos);
        } catch (error) {
            mensajeProducto.textContent =
                "No fue posible buscar el producto.";
        }
    }

    function eliminarProductosSeleccionados() {
        mensajeProducto.textContent = "";

        const filasSeleccionadas = document.querySelectorAll(
            ".fila-producto .checkbox-producto:checked"
        );

        if (filasSeleccionadas.length === 0) {
            mensajeProducto.textContent =
                "Seleccione uno o varios productos para eliminarlos.";
            return;
        }

        filasSeleccionadas.forEach((checkbox) => {
            checkbox.closest(".fila-producto").remove();
        });

        mostrarFilaVaciaSiEsNecesario();
        calcularTotalVenta();
    }

    botonAgregarProducto.addEventListener("click", buscarYAgregarProducto);

    botonEliminarSeleccionados.addEventListener(
        "click",
        eliminarProductosSeleccionados
    );

    inputBuscarProducto.addEventListener("input", () => {
        clearTimeout(tiempoBusqueda);

        tiempoBusqueda = setTimeout(() => {
            buscarSugerencias();
        }, 300);
    });

    inputBuscarProducto.addEventListener("keydown", (evento) => {
        if (evento.key === "Enter") {
            evento.preventDefault();
            buscarYAgregarProducto();
        }

        if (evento.key === "Escape") {
            cerrarSugerencias();
        }
    });

    document.addEventListener("click", (evento) => {
        if (!evento.target.closest(".buscador-producto-contenedor")) {
            cerrarSugerencias();
        }
    });
</script>

{% endblock %}
