{% load static %}
<!DOCTYPE html>
<html lang="es">

<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Recuperar contraseña | AppMecánica Emilio</title>

    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">

    <link rel="stylesheet"
          href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.6.0/css/all.min.css">

<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:'Poppins',sans-serif;
}

body{

    min-height:100vh;

    display:flex;
    justify-content:center;
    align-items:center;

    background:linear-gradient(135deg,#0f172a,#1e3a8a,#2563eb);

}

.card{

    width:430px;

    background:white;

    border-radius:25px;

    padding:40px;

    box-shadow:0 20px 45px rgba(0,0,0,.25);

    animation:aparece .8s;

}

@keyframes aparece{

from{

opacity:0;
transform:translateY(40px);

}

to{

opacity:1;
transform:translateY(0);

}

}

.logo{

    width:120px;
    display:block;
    margin:auto;
    margin-bottom:15px;

}

h1{

    text-align:center;

    color:#1d4ed8;

    margin-bottom:10px;

}

.descripcion{

    text-align:center;

    color:#64748b;

    font-size:15px;

    margin-bottom:30px;

}

label{

    display:block;

    margin-bottom:8px;

    font-weight:600;

}

input{

    width:100%;

    padding:15px;

    border-radius:12px;

    border:1px solid #cbd5e1;

    outline:none;

    transition:.3s;

}

input:focus{

border-color:#2563eb;

box-shadow:0 0 10px rgba(37,99,235,.25);

}

button{

    width:100%;

    margin-top:25px;

    padding:15px;

    border:none;

    border-radius:12px;

    background:#2563eb;

    color:white;

    font-size:17px;

    font-weight:bold;

    cursor:pointer;

    transition:.3s;

}

button:hover{

background:#1d4ed8;

transform:translateY(-2px);

}

.volver{

display:block;

text-align:center;

margin-top:20px;

text-decoration:none;

color:#2563eb;

font-weight:600;

}

.icono{

font-size:60px;

color:#2563eb;

text-align:center;

margin-bottom:20px;

}

</style>

</head>

<body>

<div class="card">

<img src="{% static 'img/logo.png' %}" class="logo">

<div class="icono">

<i class="fa-solid fa-envelope-circle-check"></i>

</div>

<h1>Recuperar contraseña</h1>

<p class="descripcion">

Ingrese el correo electrónico asociado a su cuenta.
Le enviaremos un enlace para restablecer su contraseña.

</p>

<form method="post">

{% csrf_token %}

{{ form.email.label_tag }}

{{ form.email }}

<button>

<i class="fa-solid fa-paper-plane"></i>

Enviar enlace

</button>

</form>

<a href="{% url 'login' %}" class="volver">

<i class="fa-solid fa-arrow-left"></i>

Volver al inicio de sesión

</a>

</div>

</body>

</html>
