<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Iniciar sesión</title>
    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            min-height: 100vh;
            font-family: Arial, sans-serif;
            background: linear-gradient(135deg, #f4f7fb, #e9eef7);
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }

        .login-card {
            width: 100%;
            max-width: 420px;
            background: #ffffff;
            border-radius: 18px;
            box-shadow: 0 15px 35px rgba(0, 0, 0, 0.10);
            padding: 32px 28px;
        }

        .login-card h1 {
            margin: 0 0 24px;
            text-align: center;
            color: #1f2937;
            font-size: 28px;
        }

        .field {
            margin-bottom: 18px;
        }

        .field label {
            display: block;
            margin-bottom: 8px;
            font-weight: 600;
            color: #374151;
        }

        .field input {
            width: 100%;
            height: 48px;
            border: 1px solid #cbd5e1;
            border-radius: 12px;
            padding: 0 14px;
            font-size: 15px;
            outline: none;
            transition: 0.2s ease;
        }

        .field input:focus {
            border-color: #2563eb;
            box-shadow: 0 0 0 3px rgba(37, 99, 235, 0.15);
        }

        .password-wrapper {
            position: relative;
        }

        .password-wrapper input {
            padding-right: 48px;
        }

        .toggle-password {
            position: absolute;
            top: 50%;
            right: 12px;
            transform: translateY(-50%);
            border: none;
            background: none;
            cursor: pointer;
            font-size: 20px;
            color: #64748b;
        }

        .submit-btn {
            width: 100%;
            height: 48px;
            border: none;
            border-radius: 12px;
            background: #2563eb;
            color: white;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            margin-top: 6px;
            transition: 0.2s ease;
        }

        .submit-btn:hover {
            background: #1d4ed8;
        }

        .links {
            margin-top: 18px;
            text-align: center;
        }

        .links a {
            display: block;
            margin-top: 12px;
            text-decoration: none;
            color: #2563eb;
            font-size: 15px;
        }

        .links a:hover {
            text-decoration: underline;
        }

        .form-error {
            background: #fee2e2;
            color: #991b1b;
            border-radius: 10px;
            padding: 10px 12px;
            margin-bottom: 16px;
            font-size: 14px;
        }
    </style>
</head>
<body>
    <div class="login-card">
        <h1>Iniciar sesión</h1>

        <form method="post" action="{% url 'login' %}">
            {% csrf_token %}

            {% if form.non_field_errors %}
                <div class="form-error">
                    {{ form.non_field_errors }}
                </div>
            {% endif %}

            <div class="field">
                <label for="id_username">Correo o usuario</label>
                <input
                    type="text"
                    name="username"
                    id="id_username"
                    placeholder="Ingresar correo o usuario"
                    autocomplete="username"
                    required
                >
            </div>

            <div class="field">
                <label for="current-password">Contraseña</label>
                <div class="password-wrapper">
                    <input
                        type="password"
                        name="password"
                        id="current-password"
                        placeholder="Ingresar contraseña"
                        autocomplete="current-password"
                        required
                    >
                    <button
                        type="button"
                        class="toggle-password"
                        id="togglePassword"
                        aria-label="Mostrar contraseña mientras se mantenga presionado"
                    >👁</button>
                </div>
            </div>

            {% if next %}
                <input type="hidden" name="next" value="{{ next }}">
            {% endif %}

            <button type="submit" class="submit-btn">Iniciar sesión</button>

            <div class="links">
                <a href="{% url 'password_reset' %}">¿Olvidaste tu contraseña?</a>
                <a href="{% url 'registro' %}">Crear o registrar nuevo usuario</a>
            </div>
        </form>
    </div>

    <script>
        const passwordInput = document.getElementById('current-password');
        const togglePassword = document.getElementById('togglePassword');

        function showPassword() {
            passwordInput.type = 'text';
        }

        function hidePassword() {
            passwordInput.type = 'password';
        }

        togglePassword.addEventListener('mousedown', showPassword);
        togglePassword.addEventListener('mouseup', hidePassword);
        togglePassword.addEventListener('mouseleave', hidePassword);
        togglePassword.addEventListener('touchstart', showPassword);
        togglePassword.addEventListener('touchend', hidePassword);
    </script>
</body>
</html>
