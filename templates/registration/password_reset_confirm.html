{% load static %}
<!DOCTYPE html>
<html lang="es">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">

<title>Nueva contraseña | AppMecaniza</title>

<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">

<link rel="stylesheet"
href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.6.0/css/all.min.css">

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:Poppins,sans-serif;
}

body{

display:flex;
justify-content:center;
align-items:center;

height:100vh;

background:linear-gradient(135deg,#0f172a,#1e3a8a,#2563eb);

}

.card{

width:450px;

background:white;

padding:40px;

border-radius:22px;

box-shadow:0 20px 45px rgba(0,0,0,.25);

animation:sube .8s;

}

@keyframes sube{

from{
opacity:0;
transform:translateY(30px);
}

to{
opacity:1;
transform:translateY(0);
}

}

.logo{

width:120px;

display:block;

margin:auto;

margin-bottom:20px;

}

h2{

text-align:center;

color:#1e40af;

margin-bottom:25px;

}

label{

display:block;

font-weight:600;

margin-bottom:8px;

margin-top:18px;

}

input{

width:100%;

padding:15px;

border-radius:12px;

border:1px solid #CBD5E1;

font-size:15px;

}

input:focus{

outline:none;

border-color:#2563eb;

box-shadow:0 0 12px rgba(37,99,235,.25);

}

button{

width:100%;

margin-top:28px;

padding:15px;

border:none;

background:#2563eb;

color:white;

border-radius:12px;

font-size:17px;

font-weight:bold;

cursor:pointer;

transition:.3s;

}

button:hover{

background:#1d4ed8;

transform:translateY(-2px);

}

</style>

</head>

<body>

<div class="card">

<img src="{% static 'img/logo.png' %}" class="logo">

<h2>

<i class="fa-solid fa-key"></i>

Crear nueva contraseña

</h2>

<form method="post">

{% csrf_token %}

{{ form.as_p }}

<button>

<i class="fa-solid fa-floppy-disk"></i>

Guardar contraseña

</button>

</form>

</div>

</body>

</html>
